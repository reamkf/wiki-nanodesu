name: Update CSV from Google Sheets

on:
    schedule:
        # 毎日06:00 JST (前日21:00 UTC) に定期実行
        - cron: "0 21 * * *"
    workflow_dispatch:

concurrency:
    group: "update-csv"
    cancel-in-progress: false

jobs:
    fetch-csv:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            changed: ${{ steps.check-diff.outputs.changed }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: ".bun-version"

            - name: Restore node_modules cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules
                  key: ${{ runner.os }}-bun-modules-${{ hashFiles('**/bun.lock') }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Fetch CSV from Google Sheets
              env:
                  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
              run: bun scripts/fetch-csv-from-sheets.ts

            - name: Check CSV diff
              id: check-diff
              run: |
                  git add -- 'csv/*.csv'
                  if git diff --cached --quiet; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    echo "CSVに差分はないのです。"
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Upload CSV artifact
              if: steps.check-diff.outputs.changed == 'true'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: fetched-csv
                  path: csv/

    commit-and-pr:
        needs: fetch-csv
        if: needs.fetch-csv.outputs.changed == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Download CSV artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: fetched-csv
                  path: csv/

            - name: Create Pull Request
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git checkout -B bot/update-csv
                  git fetch origin bot/update-csv --depth=1 || true
                  git add -- 'csv/*.csv'
                  git commit -m "chore: update csv files"
                  git push -u --force-with-lease origin bot/update-csv
                  if gh pr view bot/update-csv --json number --jq .number > /dev/null 2>&1; then
                    echo "既存のPRを更新したのです。"
                  else
                    gh pr create --head bot/update-csv --base main --title "chore: Google SheetsからCSVを更新" --body "Google SheetsからCSVファイルを自動取得したのです。差分を確認してマージしてほしいのです。マージ後にPagesへのデプロイが実行されるのです。"
                  fi
